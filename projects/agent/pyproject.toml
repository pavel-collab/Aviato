[project]
name = "aviatrade-agent"
version = "0.1.0"
description = "Агентный граф AviaTrade (LangGraph router + субагенты) для LangGraph Server."
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain>=1.0",
    "langchain-openai>=0.3",
    "langgraph>=0.3",
    "pydantic>=2.0",
    "shared.core",
    "shared.db",
    "shared.scraper",
    "shared.analytics",
    "shared.services",
]

# Устанавливаемый пакет (не package=false): граф должен импортироваться как
# `aviatrade_agent.graph:graph` и при `langgraph dev`, и в langgraph-api образе —
# без манипуляций sys.path.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aviatrade_agent"]

[project.optional-dependencies]
# Локальный запуск графа: uv run --project projects/agent --extra langgraph langgraph dev
langgraph = ["langgraph-cli[inmem]>=0.2"]

[tool.uv.sources]
"shared.core" = { workspace = true }
"shared.db" = { workspace = true }
"shared.scraper" = { workspace = true }
"shared.analytics" = { workspace = true }
"shared.services" = { workspace = true }
