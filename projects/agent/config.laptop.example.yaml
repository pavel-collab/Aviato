# Конфиг агента для SPLIT-деплоя: LangGraph Server на НОУТБУКЕ, данные на Pi.
# Скопируйте в config.laptop.yaml и впишите IP Pi + ключ OpenRouter.
# (config.laptop.yaml в .gitignore — секреты только там.)

database:
  host: 192.168.1.50   # ← ЗАМЕНИТЕ на IP вашего Raspberry Pi
  port: 5432
  user: flight_user
  password: flight_password
  database: flight_prices

rabbitmq:
  host: 192.168.1.50   # ← ЗАМЕНИТЕ на IP вашего Raspberry Pi
  port: 5672
  user: guest          # см. примечание про guest/loopback_users ниже
  password: guest
  scrape_queue: scrape_tasks
  job_queue: aviatrade_jobs

scraper:
  # Агент не скрапит сам — публикует задачу в очередь на Pi.
  mode: rabbitmq
  headless: true
  max_flights: 20

charts:
  # Локальный том ноутбука (общий с backend: ./charts).
  output_dir: /app/charts
  public_base_url: "http://localhost:8000/static"

llm:
  api_key: "sk-..."    # ← впишите ключ OpenRouter
  base_url: "https://openrouter.ai/api/v1"
  model: "openai/gpt-4o-mini"
