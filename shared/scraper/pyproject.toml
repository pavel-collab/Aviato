[project]
name = "shared.scraper"
version = "0.1.0"
description = "Скрапер Aviasales (botasaurus) и контракт задач скрапинга для AviaTrade."
requires-python = ">=3.10"
dependencies = [
    "botasaurus>=4.0.36",
    "pydantic>=2.0",
    "loguru>=0.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
