[project]
name = "shared.analytics"
version = "0.1.0"
description = "Визуализация (matplotlib/seaborn) и статистика цен для AviaTrade."
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
