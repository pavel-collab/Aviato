[project]
name = "shared.core"
version = "0.1.0"
description = "Общие настройки (pydantic-settings + YAML) и логирование для всех сервисов AviaTrade."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
