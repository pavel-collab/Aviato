[project]
name = "shared.db"
version = "0.1.0"
description = "ORM-модели и синхронный доступ к TimescaleDB для сервисов AviaTrade."
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9.9",
    "shared.core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.uv.sources]
"shared.core" = { workspace = true }
