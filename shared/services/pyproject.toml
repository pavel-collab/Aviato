[project]
name = "shared.services"
version = "0.1.0"
description = "Прикладные use-cases AviaTrade: оркестрация скрапинга, очередь, фоновый мониторинг."
requires-python = ">=3.10"
dependencies = [
    "aio-pika>=9.4",
    "shared.core",
    "shared.db",
    "shared.scraper",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.uv.sources]
"shared.core" = { workspace = true }
"shared.db" = { workspace = true }
"shared.scraper" = { workspace = true }
