version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flight_prices_db

    environment:
      POSTGRES_DB: flight_prices
      POSTGRES_USER: flight_user
      POSTGRES_PASSWORD: flight_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight_user -d flight_prices"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: