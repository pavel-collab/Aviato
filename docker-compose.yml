# Полный стек AviaTrade (uv-workspace монорепо) с профилями запуска.
#
# Профили (--profile):
#   infra — служебные сервисы: TimescaleDB, Redis, RabbitMQ и масштабируемый
#           сервис-скрапер. Этого достаточно, чтобы тестировать скрапинг
#           скриптами/CLI и чтобы запускать агента локально через `langgraph dev`.
#   agent — то же, что infra, плюс LangGraph Server (граф агента) и его run-state БД.
#   app   — полное приложение: infra + agent + backend + worker + OpenWebUI.
#   full  — все сервисы без исключения. Нужен, чтобы одной командой
#           `docker compose --profile full down/stop` остановить вообще всё,
#           независимо от того, каким профилем оно было поднято.
#
# Примеры:
#   docker compose --profile infra up -d                 # только служебные сервисы
#   docker compose --profile app   up -d --build         # всё приложение
#   docker compose --profile full  down                  # остановить все сервисы
#
# Конфиги контейнеров монтируются из projects/<svc>/config.docker.yaml
# (docker-хосты; в .gitignore — создайте из config.docker.example.yaml).
# Инструменты на хосте (CLI, langgraph dev) читают config.yaml (localhost).
#
# Очереди RabbitMQ: scrape_tasks (→ scraper) и aviatrade_jobs (→ worker).

services:
  # --- Данные приложения: TimescaleDB ----------------------------------------
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: flight_prices_db
    profiles: ["infra", "agent", "app", "full"]
    environment:
      POSTGRES_DB: flight_prices
      POSTGRES_USER: flight_user
      POSTGRES_PASSWORD: flight_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight_user -d flight_prices"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Run-state самого LangGraph Server (НЕ данные приложения) --------------
  langgraph-postgres:
    image: postgres:16
    container_name: aviatrade_langgraph_db
    profiles: ["agent", "app", "full"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - langgraph_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis: внутренняя очередь LangGraph Server (БД /0) И статусы задач (/1).
  redis:
    image: redis:7
    container_name: aviatrade_redis
    profiles: ["infra", "agent", "app", "full"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Прикладная очередь сообщений ------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: aviatrade_rabbitmq
    profiles: ["infra", "agent", "app", "full"]
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # --- Сервис-скрапер (масштабируемый воркер очереди) ------------------------
  # Единственный образ с Chromium. Масштаб: docker compose up -d --scale scraper=3
  scraper:
    build:
      context: .
      dockerfile: projects/scraper/Dockerfile
    profiles: ["infra", "agent", "app", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SETTINGS_PATH: /app/projects/scraper/config.docker.yaml
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./projects/scraper/config.docker.yaml:/app/projects/scraper/config.docker.yaml:ro
    restart: unless-stopped

  # --- LangGraph Server (граф агента) ----------------------------------------
  agent:
    build:
      context: .
      dockerfile: projects/agent/Dockerfile
    container_name: aviatrade_agent
    profiles: ["agent", "app", "full"]
    ports:
      - "8123:8000"  # REST графа (для отладки; наружу смотрит backend)
    depends_on:
      postgres:
        condition: service_healthy
      langgraph-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Run-state самого LangGraph Server.
      DATABASE_URI: postgres://postgres:postgres@langgraph-postgres:5432/postgres?sslmode=disable
      REDIS_URI: redis://redis:6379
      # Конфиг приложения (БД/LLM/scraper/rabbitmq) графа.
      SETTINGS_PATH: /app/projects/agent/config.docker.yaml
      PYTHONUNBUFFERED: "1"
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-aviatrade}
    volumes:
      - ./projects/agent/config.docker.yaml:/app/projects/agent/config.docker.yaml:ro

  # --- FastAPI backend (внешний API) -----------------------------------------
  backend:
    build:
      context: .
      dockerfile: projects/backend/Dockerfile
    container_name: aviatrade_backend
    profiles: ["app", "full"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent:
        condition: service_started
    environment:
      SETTINGS_PATH: /app/projects/backend/config.docker.yaml
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./projects/backend/config.docker.yaml:/app/projects/backend/config.docker.yaml:ro
      - ./charts:/app/projects/backend/charts
    command: ["python", "-m", "src"]

  # --- Worker: chat-очередь → граф (через SDK) -------------------------------
  worker:
    build:
      context: .
      dockerfile: projects/backend/Dockerfile
    container_name: aviatrade_worker
    profiles: ["app", "full"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent:
        condition: service_started
    environment:
      SETTINGS_PATH: /app/projects/backend/config.docker.yaml
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./projects/backend/config.docker.yaml:/app/projects/backend/config.docker.yaml:ro
    command: ["python", "-m", "src.worker"]

  # --- Frontend: OpenWebUI ---------------------------------------------------
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: aviatrade_openwebui
    profiles: ["app", "full"]
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_started
    environment:
      OPENAI_API_BASE_URL: http://backend:8000/v1
      OPENAI_API_KEY: aviatrade-local
      ENABLE_OPENAI_API: "true"
      ENABLE_OLLAMA_API: "false"
      WEBUI_NAME: "AviaTrade Assistant"
      WEBUI_AUTH: "false"
      ENABLE_SIGNUP: "false"
      DEFAULT_MODELS: "aviatrade-agent"
      DEFAULT_LOCALE: "ru"
      # Отключение служебных AI-запросов (не засорять сессию / не тратить токены).
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_SEARCH_QUERY_GENERATION: "false"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      ENABLE_WEB_SEARCH: "false"
      ENABLE_IMAGE_GENERATION: "false"
      ENABLE_CODE_INTERPRETER: "false"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_MESSAGE_RATING: "false"
    volumes:
      - openwebui_data:/app/backend/data
    restart: unless-stopped

volumes:
  postgres_data:
  langgraph_postgres_data:
  openwebui_data:
