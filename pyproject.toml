# Корень монорепо-workspace AviaTrade. Это НЕ устанавливаемый пакет
# (`package = false`): здесь нет своего кода — только общие библиотеки в
# `shared/*` и деплой-сервисы в `projects/*`. Зависимости ниже задают окружение
# для скриптов ручного тестирования (`scripts/`): они тянут общие библиотеки и
# langgraph-sdk, но сам корень ничего не собирает и не экспортирует.
[project]
name = "aviatrade"
version = "1.0.0"
description = "Flight price monitoring system for Aviasales.ru (workspace root)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Окружение для скриптов в `scripts/`. Тяжёлые зависимости
# (botasaurus/sqlalchemy/matplotlib/…) приходят транзитивно через shared.*;
# напрямую нужен только langgraph-sdk (интерактивный режим агента в scripts/cli.py).
dependencies = [
    "langgraph-sdk>=0.1",
    "shared.core",
    "shared.db",
    "shared.scraper",
    "shared.analytics",
    "shared.services",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

# --- uv workspace (монорепо: общие либы в shared/, сервисы в projects/) ---------
[tool.uv]
package = false

[tool.uv.workspace]
members = ["projects/*", "shared/*"]

# Общие библиотеки разрешаются из workspace, а не из индекса PyPI.
[tool.uv.sources]
"shared.core" = { workspace = true }
"shared.db" = { workspace = true }
"shared.scraper" = { workspace = true }
"shared.analytics" = { workspace = true }
"shared.services" = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
