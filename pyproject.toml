[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aviatrade"
version = "1.0.0"
description = "Flight price monitoring system for Aviasales.ru"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AviaTrade Team"}
]
keywords = ["aviation", "flights", "prices", "monitoring", "scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "botasaurus>=4.0.36",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "textual>=0.50.0",
    "textual-plotext>=0.2.0",
    "langchain>=1.0",
    "langchain-openai>=0.3",
    "langchain-community>=0.3",
    "langgraph>=0.3",
    "langgraph-sdk>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]
# Локальный запуск графа через `uv run langgraph dev` (LangGraph Studio).
langgraph = [
    "langgraph-cli[inmem]>=0.2",
]

[project.scripts]
aviatrade = "aviatrade.cli.main:main"
aviatrade-tui = "aviatrade.cli.tui:main"

[project.urls]
Homepage = "https://github.com/aviatrade/aviatrade"
Repository = "https://github.com/aviatrade/aviatrade"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
