[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aviatrade"
version = "1.0.0"
description = "Flight price monitoring system for Aviasales.ru"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AviaTrade Team"}
]
keywords = ["aviation", "flights", "prices", "monitoring", "scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

# CLI-инструмент. Тяжёлые зависимости (botasaurus/sqlalchemy/matplotlib/…) и сам
# граф приходят транзитивно через shared.*; здесь — только то, что нужно CLI
# напрямую (langgraph-sdk для интерактивного режима агента).
dependencies = [
    "langgraph-sdk>=0.1",
    "shared.core",
    "shared.db",
    "shared.scraper",
    "shared.analytics",
    "shared.services",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

[project.scripts]
aviatrade = "aviatrade.cli.main:main"

[project.urls]
Homepage = "https://github.com/aviatrade/aviatrade"
Repository = "https://github.com/aviatrade/aviatrade"

# --- uv workspace (монорепо: общие либы в shared/, сервисы в projects/) ---------
# На время миграции корень остаётся пакетом `aviatrade` И одновременно корнем
# workspace — так старый CLI и временные re-export шимы продолжают работать, пока
# модули переезжают в shared/*. По завершении миграции (фаза 9) корень станет
# package=false, а src/aviatrade будет удалён.
[tool.uv.workspace]
members = ["projects/*", "shared/*"]

# Общие библиотеки разрешаются из workspace, а не из индекса PyPI.
[tool.uv.sources]
"shared.core" = { workspace = true }
"shared.db" = { workspace = true }
"shared.scraper" = { workspace = true }
"shared.analytics" = { workspace = true }
"shared.services" = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
